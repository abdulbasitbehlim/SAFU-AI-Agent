<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAFU Remote Access</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0e1524;--line:#22304a;--text:#e7edf7;--muted:#8fa0b8;--accent:#6c7cff;--good:#35d07f;--bad:#ff6b78}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#131d35 0,#070b14 52%);font:14px/1.5 Inter,Segoe UI,Arial,sans-serif;color:var(--text)}main{width:min(92vw,400px);padding:34px;border:1px solid var(--line);border-radius:22px;background:rgba(14,21,36,.92);box-shadow:0 28px 80px #0008}.brand{font-size:30px;font-weight:800;letter-spacing:.14em}.brand b{color:var(--accent)}.sub{margin:5px 0 24px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-size:11px}.help{color:var(--muted);margin-bottom:18px}.key{width:100%;padding:15px;border:1px solid var(--line);border-radius:12px;background:#080d18;color:var(--text);font:700 26px/1 ui-monospace,Consolas,monospace;text-align:center;letter-spacing:.35em;text-transform:uppercase;outline:none}.key:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c7cff22}button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#5365ff,#7868ff);color:white;font-weight:800;letter-spacing:.08em;cursor:pointer}.error{min-height:20px;margin-top:10px;color:var(--bad);font-size:12px}.status{display:none;margin-bottom:14px;color:var(--good)}footer{margin-top:20px;color:var(--muted);font-size:11px}</style>
</head>
<body>
<main>
  <div class="brand"><b>S</b>AFU</div>
  <div class="sub">Secure remote access</div>
  <div id="reconnecting" class="status">Reconnecting to your paired SAFU session…</div>
  <p class="help">Enter the six-character key shown by SAFU on your desktop, or scan the QR code from Remote Control.</p>
  <input id="key" class="key" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="••••••" aria-label="SAFU access key">
  <button id="connect" type="button">CONNECT</button>
  <div id="error" class="error" role="status"></div>
  <footer>Local network dashboard. Keep access keys private.</footer>
</main>
<script>
const key=document.getElementById('key'), error=document.getElementById('error'), statusEl=document.getElementById('reconnecting');
key.focus();
key.addEventListener('input',()=>{key.value=key.value.toUpperCase().replace(/[^A-Z2-9]/g,''); if(key.value.length===6) login();});
key.addEventListener('keydown',e=>{if(e.key==='Enter') login();});
document.getElementById('connect').addEventListener('click',login);
async function login(){
  const pin=key.value.trim(); if(pin.length!==6){error.textContent='Enter the 6-character key.';return;}
  error.textContent='';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});
    const d=await r.json();
    if(!r.ok||!d.ok||!d.token) throw new Error(d.error||'Login failed');
    sessionStorage.setItem('safu_key',pin); sessionStorage.setItem('safu_token',d.token); location.replace('/');
  }catch(e){error.textContent=e.message||'Connection failed';key.value='';key.focus();}
}
(async()=>{
  const device_token=localStorage.getItem('safu_device_token'); if(!device_token)return;
  statusEl.style.display='block';
  try{
    const r=await fetch('/api/device-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_token})});
    const d=await r.json();
    if(r.ok&&d.ok&&d.token){sessionStorage.setItem('safu_token',d.token);sessionStorage.setItem('safu_key',d.key||'');location.replace('/');return;}
  }catch(_){ }
  localStorage.removeItem('safu_device_token'); statusEl.style.display='none';
})();
</script>
</body>
</html>
