name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Compile source
        run: python -m compileall -q .

      - name: Public package verification
        run: python verify_safu.py

      - name: Secret and private-file publication check
        run: python scripts/check_public_repo.py

      - name: Confirm private runtime files are absent
        shell: bash
        run: |
          test ! -f config/api_keys.json
          test ! -f memory/long_term.json

  docker:
    name: Docker verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Build verification image
        run: docker build -t safu-ai-ci .
      - name: Run verification image
        run: docker run --rm safu-ai-ci
